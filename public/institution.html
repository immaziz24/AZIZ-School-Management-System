<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard | AZIZ Tuition &amp; Coaching Manager</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#060a14">
<link rel="icon" href="/icon-192.png" type="image/png">
<style>
:root{--bg:#060a14;--bg2:#0b1224;--ink:#f4efe3;--mut:#9fa8bd;--gold:#c9a24a;--gold2:#ecd592;--line:rgba(201,162,74,.25);--card:rgba(12,19,38,.92)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 Inter,system-ui,Segoe UI,sans-serif}
a{color:inherit}
header.bar{display:flex;gap:1rem;align-items:center;justify-content:space-between;padding:.9rem 1.4rem;border-bottom:1px solid var(--line);background:var(--bg2);flex-wrap:wrap}
.brand{display:flex;gap:.7rem;align-items:center;font-weight:600}.brand i{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#b88a2e,#f3dfa2);color:#120d02;display:grid;place-items:center;font-style:normal;font-weight:700}
.tag{font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--gold2);border:1px solid var(--line);border-radius:99px;padding:.2rem .7rem}
button,.btn{font:inherit;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:99px;padding:.55rem 1.1rem;cursor:pointer;text-decoration:none;display:inline-block}
button.gold{background:linear-gradient(120deg,#b88a2e,#f3dfa2 50%,#c9a24a);color:#120d02;border:0;font-weight:600}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}
.layout{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 62px)}
nav.side{border-right:1px solid var(--line);padding:1rem;background:var(--bg2)}
nav.side button{display:block;width:100%;text-align:left;border-radius:12px;border:0;margin:.15rem 0}
nav.side button[aria-current=page]{background:rgba(201,162,74,.16);color:var(--gold2)}
main{padding:1.5rem;max-width:1100px}
h1,h2{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;margin:.2rem 0 .8rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:1rem;margin:1rem 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:1.1rem 1.2rem}
.card small{color:var(--mut);display:block}.card b{font-size:1.6rem}
.empty{color:var(--mut);border:1px dashed var(--line);border-radius:16px;padding:1.2rem}
.panel{max-width:460px;margin:12vh auto;padding:0 1rem}
label{display:block;margin:.8rem 0;color:var(--mut);font-size:.9rem}
input{width:100%;margin-top:.3rem;background:rgba(6,10,20,.7);border:1px solid var(--line);border-radius:12px;padding:.75rem 1rem;color:var(--ink);font:inherit}
.err{color:#ff9a8a;min-height:1.2em}
ol.todo{padding-left:1.2rem;color:var(--mut)}
@media(max-width:760px){.layout{grid-template-columns:1fr}nav.side{border-right:0;border-bottom:1px solid var(--line);display:flex;overflow-x:auto;gap:.3rem}nav.side button{width:auto;white-space:nowrap}}
input,select{color-scheme:dark;width:100%;margin-top:.3rem;background:rgba(6,10,20,.7);border:1px solid var(--line);border-radius:12px;padding:.7rem 1rem;color:var(--ink);font:inherit}
select option{background:#0b1224}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:16px}table{border-collapse:collapse;width:100%}th,td{padding:.6rem .8rem;text-align:left;border-bottom:1px solid rgba(201,162,74,.12);vertical-align:top}th{color:var(--mut);font-weight:500;font-size:.85rem}td small{color:var(--mut)}
.toolbar{display:flex;gap:.6rem;align-items:flex-end;flex-wrap:wrap;margin:.6rem 0 1rem}.toolbar input,.toolbar select{width:auto;min-width:9rem;margin-top:0}.toolbar label{margin:0}
.actions{display:flex;gap:.7rem;flex-wrap:wrap;align-items:center;margin:.8rem 0}.row-actions{display:flex;gap:.4rem;flex-wrap:wrap}.row-actions button{padding:.3rem .8rem;font-size:.85rem}
.formcard{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:1.2rem;max-width:760px}.two{display:grid;grid-template-columns:1fr 1fr;gap:0 1rem}
.ferr{display:block;color:#ff9a8a;font-size:.85rem;min-height:0}.hint{color:var(--mut);font-size:.9rem}fieldset{border:1px solid var(--line);border-radius:12px;margin:.8rem 0}legend{color:var(--mut)}
label.chk{display:inline-flex;gap:.3rem;align-items:center;margin:.2rem .8rem .2rem 0}label.chk input{width:auto;margin:0}
.pill{border:1px solid var(--line);border-radius:99px;padding:.1rem .6rem;font-size:.8rem}.pill.paid,.pill.active{color:#8fe0a5}.pill.overdue{color:#ff9a8a}.pill.inactive,.pill.unpaid{color:var(--gold2)}.pill.archived{color:var(--mut)}
.tabs{display:flex;gap:.4rem;margin-bottom:.8rem}.tabs button[aria-current]{background:rgba(201,162,74,.16);color:var(--gold2)}
.seg{white-space:nowrap}.seg button{padding:.35rem .8rem;border-radius:10px;margin-right:.3rem}.seg button[aria-pressed=true]{background:var(--gold);color:#120d02}
.receipt-sheet{position:fixed;inset:0;background:rgba(0,0,0,.75);overflow:auto;padding:1rem;z-index:50}.rc{background:#fff;color:#111;max-width:520px;margin:0 auto;padding:1.5rem;border-radius:12px}.rc h2{font-family:inherit}.rc th,.rc td{color:#111;border-color:#ddd}.rc-brand{font-weight:700;font-size:1.2rem;margin:0}.rc-foot{color:#666;font-size:.8rem}.rc-actions{display:flex;gap:.7rem;justify-content:center;margin-top:1rem}
@media print{#root{display:none}.receipt-sheet{position:static;background:#fff;padding:0}.rc-actions{display:none}}
@media(max-width:560px){.two{grid-template-columns:1fr}}
/* Settings workspace and academic setup */
main.wide{max-width:none}
.setwrap{--cc:#111827;--ce:#151E2E;--cl:#293346;--cg:#D4B367;--cg2:#E5C77D;--ct:#F4F1E8;--cm:#94A3B8;display:grid;grid-template-columns:220px minmax(0,1fr);gap:1.2rem;align-items:start}
.snav{position:sticky;top:.8rem;background:var(--cc);border:1px solid var(--cl);border-radius:16px;padding:.5rem;display:flex;flex-direction:column;gap:.15rem}
.snav button{display:flex;gap:.6rem;align-items:center;text-align:left;border:0;border-radius:10px;padding:.6rem .7rem;color:var(--cm);background:transparent;transition:background .15s,color .15s}
.snav button:hover{background:var(--ce);color:var(--ct)}.snav button[aria-current=page]{background:rgba(212,179,103,.14);color:var(--cg2);box-shadow:inset 3px 0 0 var(--cg)}
.ico{display:inline-grid;place-items:center;flex:none}.spane{min-width:0}.shead h2{margin:.1rem 0 .2rem;font-size:1.6rem}.shead .hint{margin:0 0 .9rem}
.scard{background:var(--cc);border:1px solid var(--cl);border-radius:16px;padding:1.1rem;max-width:none}
.setwrap .two{display:grid;grid-template-columns:1fr 1fr;gap:0 1rem}
.setwrap button{border-color:var(--cl);border-radius:10px;transition:border-color .15s,background .15s}.setwrap button:hover:not(:disabled){border-color:var(--cg)}
.setwrap button.gold,.ovl button.gold{background:linear-gradient(120deg,#c4a050,#E5C77D 55%,#D4B367);color:#120d02;border:0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.8rem;margin:.6rem 0 1rem}.stat{background:var(--cc);border:1px solid var(--cl);border-radius:14px;padding:.8rem 1rem}.stat small{display:block;color:var(--cm)}.stat b{font-size:1.5rem;color:var(--cg2)}
.navcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:.8rem}.navcard{display:flex;gap:.8rem;align-items:center;text-align:left;background:var(--cc);border:1px solid var(--cl);border-radius:14px;padding:.9rem 1rem;width:100%}
.navcard:hover{background:var(--ce)}.navcard .ico:first-child{color:var(--cg);background:rgba(212,179,103,.1);border-radius:10px;width:38px;height:38px}.nct{flex:1;display:flex;flex-direction:column}.nct small{color:var(--cm)}
.crumb{display:flex;gap:.8rem;align-items:center;margin-bottom:.6rem}.crumb span{color:var(--cm)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.5rem;margin:.7rem 0}.tiles.small{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}
.tile{display:flex;gap:.5rem;align-items:center;text-align:left;background:var(--ce);border:1px solid var(--cl);border-radius:10px;padding:.55rem .7rem;color:var(--cm);min-height:44px;width:100%}
.tile:hover:not(:disabled){border-color:var(--cg2);color:var(--ct)}.tile.on{border-color:var(--cg);background:rgba(212,179,103,.13);color:var(--ct)}
.tile .tk{width:18px;height:18px;border-radius:5px;border:1px solid var(--cl);display:inline-grid;place-items:center;flex:none;font-size:.75rem;color:#120d02}.tile.on .tk{background:var(--cg);border-color:var(--cg)}.tile .tl{overflow-wrap:anywhere;line-height:1.25}
.tile:disabled{opacity:.5}.subcell{display:flex;flex-direction:column;gap:.15rem}.subcell small{color:var(--cm);font-size:.75rem}.subcell.arch .tile{opacity:.55}.mini{display:flex;gap:.3rem}.mini button{padding:.1rem .6rem;font-size:.75rem}
.toolrow{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;justify-content:space-between;margin:.4rem 0}.toolrow input[type=search],.toolrow select{width:auto;flex:1;min-width:140px;margin:0}.toolrow button{padding:.35rem .8rem}
.addrow{display:flex;gap:.5rem;margin:.6rem 0}.addrow input{margin:0}.addrow button{white-space:nowrap}
.mapgrid{display:grid;grid-template-columns:240px minmax(0,1fr);gap:1rem;align-items:start}
.clist{background:var(--cc);border:1px solid var(--cl);border-radius:16px;padding:.4rem;display:flex;flex-direction:column;gap:.15rem;max-height:70vh;overflow:auto}
.citem{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:.6rem;align-items:center;text-align:left;border:0;border-radius:10px;padding:.55rem .7rem;background:transparent;color:var(--cm)}
.citem .dot{grid-row:1/3;width:9px;height:9px;border-radius:50%;background:#7b8598}.citem .dot.good{background:#22C55E}.citem .dot.warn{background:#F59E0B}.citem .cn{color:var(--ct)}.citem small{color:var(--cm)}
.citem:hover{background:var(--ce)}.citem.on{background:rgba(212,179,103,.14);box-shadow:inset 3px 0 0 var(--cg)}
.cpanel{background:var(--cc);border:1px solid var(--cl);border-radius:16px;padding:1rem;min-width:0}.phead{display:flex;gap:.7rem;align-items:center;justify-content:space-between}.phead h3{margin:0;font-family:'Cormorant Garamond',Georgia,serif;font-size:1.5rem}
.stickybar{position:sticky;bottom:0;display:flex;gap:.6rem;flex-wrap:wrap;padding:.7rem 0 .2rem;background:linear-gradient(transparent,var(--cc) 30%)}
.tcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:.8rem;margin-top:.8rem}.tcard{background:var(--cc);border:1px solid var(--cl);border-radius:16px;padding:1rem;display:flex;flex-direction:column;gap:.4rem}
.thead{display:flex;gap:.7rem;align-items:center}.thead .ico{color:var(--cg);background:rgba(212,179,103,.1);border-radius:10px;width:38px;height:38px}.thead small{display:block;color:var(--cm)}
.chips{display:flex;flex-wrap:wrap;gap:.35rem}.chip{border:1px solid var(--cg);background:rgba(212,179,103,.1);color:var(--cg2);border-radius:99px;padding:.1rem .65rem;font-size:.82rem}.chip.mute{border-color:var(--cl);color:var(--cm);background:transparent}
.switch{display:flex;gap:.8rem;align-items:flex-start;padding:.7rem 0;border-bottom:1px solid var(--cl);margin:0;cursor:pointer}.switch:last-of-type{border-bottom:0}.switch input{position:absolute;opacity:0;width:1px;height:1px}
.sw{width:40px;height:22px;border-radius:99px;background:var(--cl);position:relative;flex:none;margin-top:.15rem;transition:background .15s}.sw::after{content:'';position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s}
.switch input:checked+.sw{background:var(--cg)}.switch input:checked+.sw::after{transform:translateX(18px);background:#120d02}.switch input:focus-visible+.sw{outline:2px solid var(--cg2);outline-offset:2px}.swt{display:flex;flex-direction:column;color:var(--ct)}.swt small{color:var(--cm)}
.preview p{margin:.2rem 0}.preview .warn,.hint.warn{color:#F59E0B}.hint.ok{color:#22C55E}.notice{border:1px solid #F59E0B;background:rgba(245,158,11,.08);border-radius:12px;padding:.6rem .9rem;margin-top:.5rem}.notice p{margin:.2rem 0}
.pill{white-space:nowrap}
.ovl{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:60;display:flex;justify-content:flex-end}
.drawer{background:#111827;border-left:1px solid #293346;width:min(460px,100%);height:100%;overflow:auto;padding:1rem 1.1rem;animation:slidein .18s ease-out}.drawer.wide{width:min(640px,100%)}
.dhead{display:flex;justify-content:space-between;align-items:center;gap:1rem}.dhead h3{margin:0;font-family:'Cormorant Garamond',Georgia,serif;font-size:1.5rem}.dhead button{padding:.2rem .6rem}
.dbody .tile{--cl:#293346}.dbody{--cc:#111827;--ce:#151E2E;--cl:#293346;--cg:#D4B367;--cg2:#E5C77D;--ct:#F4F1E8;--cm:#94A3B8}.dbody .tiles{display:grid}
.acard{background:#111827;border:1px solid #293346;border-radius:14px;padding:.8rem 1rem;margin:.4rem 0 .8rem;--cg:#D4B367;--cg2:#E5C77D;--cm:#94A3B8}.ahead{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}.ahead button{margin-left:auto;padding:.3rem .9rem}
.fsec{font-family:Inter,system-ui,sans-serif;font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;color:var(--gold2);margin:1.2rem 0 .2rem;border-bottom:1px solid var(--line);padding-bottom:.3rem}
.feerow{display:grid;grid-template-columns:minmax(110px,160px) auto minmax(100px,160px) 1fr;gap:.6rem;align-items:center;padding:.35rem 0;border-bottom:1px solid var(--cl)}.feerow input{margin:0}.feerow .cn{color:var(--ct)}.feerow small{color:var(--cm)}.rs{color:var(--cg2)}
.ccards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:.8rem;margin-top:.6rem}.ccard{display:flex;flex-direction:column;gap:.4rem;text-align:left;background:var(--cc);border:1px solid var(--cl);border-radius:16px;padding:.9rem 1rem;width:100%}.ccard:hover{background:var(--ce);border-color:var(--cg)}
.ccard b{font-size:1.1rem;color:var(--cg2)}.cnums{display:grid;grid-template-columns:repeat(3,1fr);gap:.4rem}.cnums small{display:block;color:var(--cm);font-size:.72rem}
@media(max-width:560px){.feerow{grid-template-columns:1fr auto 1fr}.feerow small{display:none}}
@keyframes slidein{from{transform:translateX(24px);opacity:.4}to{transform:none;opacity:1}}
@media(max-width:900px){.setwrap{grid-template-columns:1fr}.snav{position:static;flex-direction:row;overflow-x:auto;white-space:nowrap}.snav button{flex:none}.mapgrid{grid-template-columns:1fr}.clist{flex-direction:row;overflow-x:auto;max-height:none}.citem{flex:none;min-width:130px}}
@media(max-width:560px){.setwrap .two{grid-template-columns:1fr}.tiles{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}.drawer,.drawer.wide{width:100%}.addrow{flex-direction:column}}
@media(prefers-reduced-motion:reduce){.drawer{animation:none}*{transition:none!important}}
</style></head>
