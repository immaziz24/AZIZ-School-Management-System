<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AZIZ School Management System</title>
  <link rel="stylesheet" href="./sign-in.css">
</head>
<body>
  <main>
    <h1>AZIZ School Management System</h1>
    <p id="firebase-status" role="status">Loading sign-in.</p>
    <form id="sign-in" hidden>
      <p><label>Email <input name="email" type="email" autocomplete="username" required></label></p>
      <p><label>Password <input name="password" type="password" autocomplete="current-password" required></label></p>
      <button type="submit">Sign in</button>
    </form>
    <section id="owner-dashboard" aria-labelledby="school-name" hidden>
      <h2 id="school-name"></h2>
      <dl>
        <dt>Role</dt>
        <dd>School Owner</dd>
        <dt>Signed-in account</dt>
        <dd id="owner-email"></dd>
      </dl>
      <h3>School Profile</h3>
      <form id="school-profile">
        <p><label>School name <input name="name" required maxlength="120"></label></p>
        <p><label>Contact email <input name="contactEmail" type="email" maxlength="254"></label></p>
        <p><label>Phone <input name="phone" type="tel" maxlength="40"></label></p>
        <p><label>Address <input name="address" maxlength="500"></label></p>
        <button type="submit">Save profile</button>
        <p id="profile-status" role="status"></p>
      </form>
      <h3>Staff Directory</h3>
      <p id="staff-status" role="status"></p>
      <ul id="staff-list"></ul>
      <form id="staff-form" hidden>
        <p><label>Staff name <input name="name" required maxlength="120"></label></p>
        <p><label>Job title <input name="position" required maxlength="80"></label></p>
        <p><label>Work email <input name="email" type="email" maxlength="254"></label></p>
        <button type="submit">Add staff member</button>
        <p><button type="reset" hidden>Cancel edit</button></p>
      </form>
    </section>
    <button id="sign-out" type="button" hidden>Sign out</button>
  </main>
  <script type="module">
    const status = document.querySelector('#firebase-status');
    try {
      await import('./sign-in.mjs');
    } catch (error) {
      status.textContent = 'Sign-in could not load. Refresh to try again.';
      console.error(error);
    }
  </script>
</body>
</html>
